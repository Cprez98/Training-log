<style>
/* Palette: deep teal ground, warm off-white for all text, lilac for charts and accents. */
:root {
  --bg: #2c4e4e;
  --card: #264545;
  --ink: #f7f3ef;
  --muted: #f7f3ef;
  --line: rgba(247, 243, 239, 0.18);
  --accent: #967bb6;
  --accent-soft: rgba(150, 123, 182, 0.26);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: clamp(15px, 0.4vw + 14px, 17px)/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
h1 { font-size: clamp(28px, 4vw + 16px, 44px); line-height: 1; text-transform: uppercase; }
h2 { font-size: clamp(22px, 2vw + 16px, 30px); line-height: 1.05; }
h3 { font-size: clamp(17px, 0.6vw + 16px, 21px); text-transform: uppercase; letter-spacing: 0.04em; }
p { margin: 0; }
.kicker { font: 500 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; width: 100%; max-width: 1180px; margin-inline: auto; }
.masthead .meta { text-align: right; display: grid; justify-items: end; gap: 6px; }
.refresh {
  min-height: 40px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent-soft); color: var(--ink); font: 600 13px var(--mono); letter-spacing: 0.04em; cursor: pointer;
}
.refresh:disabled { opacity: 0.6; cursor: progress; }
.refresh:focus-visible, .tabbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.refresh:active, .tabbar button:active { transform: scale(0.98); }
#view { width: 100%; max-width: 1180px; margin-inline: auto; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
#view > * { min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.hero .big { font: 700 clamp(26px, 2vw + 14px, 32px)/1.05 var(--display); text-transform: uppercase; margin: 6px 0 2px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.tile .num { font: 600 clamp(24px, 2.2vw + 16px, 34px)/1.1 var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .label { font: 500 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .sub { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; gap: 5px; align-items: center; padding: 3px 9px; border-radius: 4px; font: 600 12px/1.4 var(--mono); white-space: nowrap; background: var(--line); color: var(--ink); }
.pr { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.pr:first-of-type { border-top: 0; }
.pr .val { font: 600 20px/1.1 var(--display); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(0, 110px) 1fr 28px; gap: 10px; align-items: center; margin: 9px 0; font-size: 14px; }
.hbar .track { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); }
.hbar .n { text-align: right; font-family: var(--mono); }
/* Readiness widget: colour shows the load state at a glance. */
.readiness { --tone: var(--muted); border-left: 6px solid var(--tone); }
.readiness.red { --tone: #e5484d; background: linear-gradient(0deg, rgba(229, 72, 77, 0.18), rgba(229, 72, 77, 0.18)), var(--card); }
.readiness.green { --tone: #3fb950; background: linear-gradient(0deg, rgba(63, 185, 80, 0.18), rgba(63, 185, 80, 0.18)), var(--card); }
.readiness.orange { --tone: #f59e0b; background: linear-gradient(0deg, rgba(245, 158, 11, 0.18), rgba(245, 158, 11, 0.18)), var(--card); }
.readiness .pill { background: var(--tone); color: #111; }
.readiness .big { font: 700 clamp(22px, 2vw + 12px, 28px)/1.15 var(--display); text-transform: uppercase; margin: 8px 0; }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 4px; font-size: 13px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--accent); }
.chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .trend { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .target-line { stroke: #BF9903; stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .target-label { fill: #BF9903; font: 600 10px var(--mono); }
/* Benchmark girls widgets: the best result is the main figure, with elite targets in gold. */
.gw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.gw { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.gw-name { font: 600 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.gw-val { font: 600 clamp(24px, 2vw + 12px, 30px)/1.1 var(--display); font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.gw-sub { font-size: 12px; }
.gw-test { font-size: 12px; margin-top: 4px; }
/* Benchmark girls: list of workout widgets, each with its description underneath. */
/* Two widgets per row keeps the girls list short to scroll; one column only on very narrow screens. */
.wl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
@media (max-width: 320px) { .wl { grid-template-columns: minmax(0, 1fr); } }
.gw-info { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: 12px; display: grid; gap: 3px; }
.gw-info p { margin: 0; }
.gw-target { font-size: 12px; margin-top: 6px; }
.test-next .big { font: 700 clamp(26px, 2vw + 14px, 32px)/1.05 var(--display); text-transform: uppercase; margin: 6px 0 4px; }
.gw-gap { font-size: 12px; color: var(--muted); }
/* Targets and predictions use gold #BF9903. */
.gold { color: #BF9903; }
.target { margin-top: 10px; display: grid; gap: 6px; font-size: 14px; }
.target .trow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.target .tbar { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.target .tbar div { height: 100%; background: #BF9903; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 10px var(--mono); }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
dl.legend { margin: 8px 0 0; display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
dl.legend dt { font-weight: 600; color: var(--ink); display: inline; }
dl.legend dd { display: inline; margin: 0; }
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(100%, 720px); bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--card); border-top: 1px solid var(--line);
}
.tabbar button {
  min-height: 52px; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
  font: 600 13px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
}
.tabbar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
/* Responsive: phones one column; tablets two columns; laptops and desktops three across for the lift charts. */
@media (max-width: 340px) { .tile .num { font-size: 26px; } }
@media (min-width: 720px) {
  #view { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #view > .hero, #view > .notice, #view > p, #view > .grid-2, #view > .wide { grid-column: 1 / -1; }
  .card { padding: 20px; }
  .hbar { grid-template-columns: 140px 1fr 36px; }
}
@media (min-width: 1024px) {
  #view.progress-view { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (pointer: coarse) { .tabbar button { min-height: 56px; } .refresh { min-height: 44px; } }
@media (hover: hover) { .tabbar button:hover { color: var(--ink); } .refresh:hover { filter: brightness(1.15); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
[hidden] { display: none !important; }

  }

    <div class="wl">${WORKOUTS.map(w => girlWidget(girlSpec(w), d.bench.records, d.now)).join("")}</div>
  </section>`;
}
// One small widget per lift: best estimated 1RM as the main figure, with the target and predicted date in gold.
function liftWidget(name, entries, now) {
  const target = TARGETS[name];
  const testLine = testStatus(latestDate(entries), LIFT_TEST_DAYS[name] ?? 56, now).text;
  const cur = entries.length ? entries.reduce((a, b) => (b.est1rm > a.est1rm ? b : a)) : null;
  const value = cur ? `${f1(cur.est1rm)} kg` : "–";
  const sub = cur ? fDate(cur.date) : "";
  let targetLine = "", gap = "", pred = "";
  if (target) {
    targetLine = `<div class="gw-target">Target <strong class="gold">${target} kg</strong></div>`;
    if (cur) {
      const diff = target - cur.est1rm;
      gap = diff > 0 ? `${f1(diff)} kg to go` : "Target reached";
      if (diff > 0) {
        const p = predictDate(entries, target, now);
        pred = `<div class="gw-gap">Predicted <strong class="gold">${esc(p instanceof Date ? fDate(p) : p ?? "–")}</strong></div>`;
      }
    }
  }
  return `<article class="gw">
    <div class="gw-name">${esc(name)}</div>
    <div class="gw-val">${esc(value)}</div>
    <div class="gw-sub muted">${esc(sub)}</div>
    <div class="gw-test">${esc(testLine)}</div>
    ${targetLine}
    ${gap ? `<div class="gw-gap">${esc(gap)}</div>` : ""}
    ${pred}
  </article>`;
}
function liftsCard(d) {
  const names = [...Object.keys(TARGETS), ...d.summary.prs.map(p => p.lift).filter(n => !TARGETS[n])];
  return `<section class="card wide">
    <div class="card-head"><h3>Lift personal bests</h3></div>
    <p class="small muted" style="margin-bottom:8px">Best estimated 1RM for each lift. Gold is your target and predicted date, as on the Progress tab.</p>
    <div class="gw-grid">${names.map(n => liftWidget(n, d.lifts.records.filter(r => r.lift === n), d.now)).join("")}</div>
  </section>`;
}
function renderStats(d) {
  const s = d.summary, l = s.last;
  const since = s.sinceLast == null ? "" : s.sinceLast === 0 ? "today" : s.sinceLast === 1 ? "yesterday" : `${s.sinceLast} days ago`;
  const hero = l
    ? `<p class="kicker">Last session · ${esc(fDate(l.date))} · ${esc(since)}</p>
       <p class="big">${esc(l.type)}${l.movements ? " · " + esc(l.movements) : ""}</p>`
    : `<p class="big">No sessions yet</p><p class="muted small">Log a session to see it here.</p>`;
  return `${issues(d)}
    ${testNextCard(d)}
    <section class="card hero wide">${hero}</section>
    <section class="grid-2">
      ${tile("Sessions", s.s7, "last 7 days")}${tile("Sessions", s.s30, "last 30 days")}
      ${tile("Minutes", s.min30, "last 30 days")}${tile("Avg effort", f1(s.rpe30), "RPE 1–10, 30 days")}
      ${tile("Avg recovery", f1(s.rec30), "scale 1–5, 30 days")}${tile("All sessions", s.total, "since you started")}
    </section>
    ${s.future ? `<p class="small muted wide">${s.future} entr${s.future === 1 ? "y is" : "ies are"} dated after today and left out of the 30-day figures.</p>` : ""}
    ${girlsCard(d)}
    ${liftsCard(d)}`;
}
function renderTrends(d) {
  const weeks = weeklyTrend(d.sessions.records, d.now);
  if (!weeks.length) return `${issues(d)}<section class="card"><p class="empty">Trends appear once a few sessions are logged.</p></section>`;
  const types = typeCounts(d.sessions.records), maxT = Math.max(1, ...types.map(t => t.count));
  const labels = weeks.map(w => short(w.start));
  return `${issues(d)}
    <section class="card"><div class="card-head"><h3>Sessions per week</h3></div>
      <p class="small muted" style="margin-bottom:6px">Every week since your first session. Gaps are weeks with no training.</p>
      ${barChart(labels, weeks.map(w => w.sessions), "Sessions per week")}</section>
    <section class="card"><div class="card-head"><h3>Minutes per week</h3></div>
      ${barChart(labels, weeks.map(w => Math.round(w.minutes)), "Minutes per week")}</section>
    <section class="card wide"><div class="card-head"><h3>Session types</h3></div>
      ${types.map(t => `<div class="hbar"><span>${esc(t.type)}</span><div class="track"><div class="fill" style="width:${t.count / maxT * 100}%"></div></div><span class="n">${t.count}</span></div>`).join("")}</section>`;
}
const LABELS = { up: "Improving", down: "Dropping", flat: "Holding steady", new: "Only recent data so far", stale: "No entry in the last 90 days" };
const ARROWS = { up: "▲", down: "▼", flat: "▶", new: "●", stale: "○" };
// Target weights (kg) for each lift. Compared against the best estimated 1RM.
const TARGETS = {
  "Snatch": 110, "Squat Snatch": 100, "Clean": 160, "Clean & Jerk": 150, "Deadlift": 250,
  "Back Squat": 220, "Power Snatch": 100, "Power Clean": 135, "Strict Press": 90, "Bench Press": 150,
  "Front Squat": 185, "Overhead Squat": 150, "Jerk (Split or Push)": 160, "Thruster": 120,
};
const DAYS_PER_YEAR = 365.25;
// Straight-line trend through every past entry for one lift. Returns the date the trend reaches the target,
// or null when there isn't enough data (fewer than 3 entries over at least 60 days) or the trend is flat or falling.
function predictDate(entries, target, now) {
  const pts = entries.filter(e => ago(now, e.date) >= 0).map(e => ({ t: e.date.getTime() / DAY, y: e.est1rm }));
  if (pts.length < 3) return null;
  const ts = pts.map(p => p.t);
  if (Math.max(...ts) - Math.min(...ts) < 60) return null;
  const n = pts.length, mt = sum(ts) / n, my = sum(pts.map(p => p.y)) / n;
  const cov = sum(pts.map(p => (p.t - mt) * (p.y - my))), varT = sum(pts.map(p => (p.t - mt) ** 2));
  const slope = cov / varT;
  if (!(slope > 0)) return null;
  // Predictions rely on recent data: nothing logged in the last 12 months means no prediction.
  if (now.getTime() / DAY - Math.max(...ts) > 365) return null;
  const nowDay = now.getTime() / DAY;
  const hitDay = mt + (target - my) / slope;
  // The trend already passed the target, but you haven't reached it yet, so there's no sensible date.
  if (hitDay < nowDay) return null;
  const daysAway = Math.max(0, hitDay - nowDay);
  if (daysAway > 5 * DAYS_PER_YEAR) return "over 5 years";
  return new Date(now.getTime() + daysAway * DAY);
}
function targetBlock(lift, entries, now) {
  const target = TARGETS[lift];
  if (!target) return '<p class="small muted">No target set for this lift.</p>';
  const current = entries.length ? Math.max(...entries.map(e => e.est1rm)) : null;
  const togo = current == null ? target : Math.max(0, target - current);
  const pct = current == null ? 0 : Math.min(100, current / target * 100);
  const pred = current != null && current >= target ? null : predictDate(entries, target, now);
  const predText = current != null && current >= target ? "Reached"
    : pred instanceof Date ? fDate(pred)
    : pred ?? "–";
  return `<div class="target">
    <div class="trow"><span>Target <strong class="gold">${target} kg</strong></span><span>${current == null ? "–" : `${f1(current)} kg now`}</span></div>
    <div class="tbar" role="img" aria-label="${Math.round(pct)}% of target"><div style="width:${pct.toFixed(1)}%"></div></div>
    <div class="trow small"><span>${togo > 0 ? `${f1(togo)} kg to go (${Math.round(pct)}%)` : "Target reached"}</span><span>Predicted <strong class="gold">${esc(predText)}</strong></span></div>
  </div>`;
}
function renderProgress(d) {
  const prog = progress(d.lifts.records, d.now);
  const entriesFor = lift => d.lifts.records.filter(r => r.lift === lift);
  const trended = prog.filter(p => !["single", "none"].includes(p.status));
  const sparse = prog.filter(p => ["single", "none"].includes(p.status));
  const cards = trended.map(p => `
    <article class="card">
      <div class="card-head"><h3>${esc(p.lift)}</h3>
        <span class="pill">${ARROWS[p.status]} ${esc(p.change != null ? (p.change > 0 ? "+" : "") + p.change + "%" : LABELS[p.status])}</span></div>
      <p class="small muted">${esc(LABELS[p.status])} · last 90 days best ${f1(p.recentBest)} kg, previous 90 days ${f1(p.priorBest)} kg</p>
      ${lineChart(p.series, `${p.lift} best estimated 1RM`, TARGETS[p.lift])}
      ${targetBlock(p.lift, entriesFor(p.lift), d.now)}
    </article>`).join("");
  const sparseCards = sparse.map(p => `
    <article class="card">
      <div class="card-head"><h3>${esc(p.lift)}</h3><span class="pill">${p.status === "none" ? "–" : "1 entry"}</span></div>
      ${p.status === "none"
        ? '<p class="empty">–</p>'
        : `${barChart([short(p.lastDate)], [Math.round(p.last)], `${p.lift} single entry`, v => v + " kg")}
           <p class="small muted">A trend line appears after a second entry.</p>`}
      ${targetBlock(p.lift, entriesFor(p.lift), d.now)}
    </article>`).join("");
  const body = cards + sparseCards;
  return `${issues(d)}
    <p class="small muted wide">Trend = best estimated 1RM in the last 90 days, compared with the 90 days before that. Gold figures are your targets and predicted dates. A predicted date needs at least 3 entries over 2+ months with an upward trend; otherwise it shows a dash.</p>
    ${body || '<section class="card"><p class="empty">Nothing to show yet.</p></section>'}`;
}
function ratioLabel(r) { return r == null ? "needs 28 days" : r < 0.8 ? "lighter week" : r <= 1.3 ? "steady build" : r <= 1.5 ? "building fast" : "sharp spike"; }
// Colour guide from the load ratio (last 7 days ÷ last 28 days):
// red above 1.5 (too high), orange 1.3–1.5 (heavy) and under 0.8 (light), green 0.8–1.3 (on track).
function readinessFor(ratio) {
  if (ratio == null) return { tone: "neutral", label: "Not enough data", advice: "Log 4 weeks of sessions to see your readiness." };
  if (ratio > 1.5) return { tone: "red", label: "Too high", advice: "Drop intensity or volume today. Choose an easier session or add rest." };
  if (ratio > 1.3) return { tone: "orange", label: "Heavy", advice: "Keep it moderate. Trim the hardest set or the longest piece." };
  if (ratio >= 0.8) return { tone: "green", label: "On track", advice: "Train as planned. Your load is right for where you are." };
  return { tone: "orange", label: "Light", advice: "You've eased off. A harder session is fine if you feel good." };
}
function renderLoad(d) {
  const today = sod(d.now);
  const days30 = Array.from({ length: 30 }, (_, i) => addDays(today, i - 29));
  const loadSeries = dailyTotals(d.sessions.records, s => sessionLoad(s) ?? 0, s => s.date, d.now, 36);
  const volSeries = dailyTotals(d.lifts.records, l => l.weight * l.reps, l => l.date, d.now, 36);
  const loadRoll = rolling(loadSeries.map(b => b.value)).slice(-30);
  const volRoll = rolling(volSeries.map(b => b.value)).slice(-30);
  const loadVals = loadSeries.slice(-30).map(b => Math.round(b.value));
  const volVals = volSeries.slice(-30).map(b => Math.round(b.value));
  const labels = days30.map(short);
  const sessionCount = d.sessions.records.filter(s => days30.some(x => dayKey(x) === dayKey(s.date))).length;
  const rest = d.sessions.records.length ? days30.filter(x => !d.sessions.records.some(s => dayKey(s.date) === dayKey(x))).length : 30;
  const unscored = d.sessions.records.filter(s => days30.some(x => dayKey(x) === dayKey(s.date)) && sessionLoad(s) == null).length;
  const total = sum(loadVals);
  const acute = sum(loadSeries.slice(-7).map(b => b.value)) / 7;
  const chronic = sum(loadSeries.slice(-28).map(b => b.value)) / 28;
  const ratio = chronic > 0 ? Math.round(acute / chronic * 100) / 100 : null;
  // Last week's load against the average of the four weeks before it.
  const lastWeek = sum(loadSeries.slice(-7).map(b => b.value));
  const priorWeeks = [2, 3, 4, 5].map(k => sum(loadSeries.slice(-7 * k, -7 * (k - 1))));
  const priorAvg = avg(priorWeeks);
  const readiness = readinessFor(ratio);
  return `${issues(d)}
    <section class="card readiness ${readiness.tone}">
      <div class="card-head"><h3>Training readiness</h3><span class="pill">${esc(readiness.label)}</span></div>
      <p class="big">${esc(readiness.advice)}</p>
      <p class="small">Last 7 days: <strong>${Math.round(lastWeek)}</strong> load${priorAvg ? ` · your 4-week average: <strong>${Math.round(priorAvg)}</strong>` : ""}${ratio != null ? ` · ratio ${f1(ratio)}` : ""}.</p>
      <p class="small muted">Green: train as planned. Orange: keep it moderate, or push a little if you've been light. Red: drop intensity or volume.</p>
    </section>
    <section class="grid-2">
      ${tile("Total load", Math.round(total), "last 30 days")}${tile("Rest days", rest, "of the last 30")}
      ${tile("Load ratio", f1(ratio), ratioLabel(ratio))}${tile("Sessions", sessionCount, "last 30 days")}
    </section>
    <section class="card"><div class="card-head"><h3>Daily load · 30 days</h3></div>
      ${barLineChart(labels, loadVals, loadRoll, "Daily training load", v => Math.round(v))}
      <p class="small muted" style="margin-top:6px">Load = minutes × effort (RPE), summed per day. Bars are daily load; the light line is the 7-day average.${unscored ? ` ${unscored} session(s) here lack minutes or effort and count as zero.` : ""}</p></section>
    <section class="card"><div class="card-head"><h3>Lifting volume · 30 days</h3></div>
      ${barLineChart(labels, volVals, volRoll, "Daily lifting volume", v => Math.round(v))}
      <p class="small muted" style="margin-top:6px">Volume = weight × reps across that day's lift entries (kg). Bars are daily volume; the light line is the 7-day average.</p></section>
    <section class="card wide"><div class="card-head"><h3>How to read it</h3></div>
      <dl class="legend"><div><dt>Load ratio</dt> <dd>average daily load over the last 7 days ÷ the last 28 days. About 0.8–1.3 is a steady build; well above that is a sudden jump.</dd></div>
      <div><dt>Note</dt> <dd>a rough guide to trends, not medical advice.</dd></div></dl></section>`;
}

// ─── Data, saving and refresh ────────────────────────────────────────────────
const state = { tab: "stats", data: null, source: "snapshot", updatedAt: null, error: null, loading: false, benchText: null };

function build(liftsText, sessionsText, benchText = BENCH_CSV) {
  const now = new Date();
  const lifts = parseLifts(liftsText), sessions = parseSessions(sessionsText), bench = parseBench(benchText);
  return { lifts, sessions, bench, now, summary: summarize(sessions.records, lifts.records, now) };
}
function readSaved() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } }
function writeSaved(obj) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); } catch { /* storage blocked: ignore */ } }

// Reads one tab straight from Google as CSV. Google answers with a web page if the sheet isn't shared.
async function getCsv(tab) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    if (!r.ok) throw new Error(`status ${r.status}`);
    const text = await r.text();
    if (/^\s*[<{]/.test(text)) throw new Error("not shared");
    return text;
  } finally { clearTimeout(timer); }
}
function describe(err) {
  if (err?.name === "AbortError") return "Google Sheets took too long to respond";
  if (err?.message === "not shared") return 'The sheet isn\'t shared for viewing. In Google Sheets choose Share → General access → "Anyone with the link"';
  return "Couldn't reach Google Sheets. Check your connection";
}
const timeLabel = ts => new Date(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

async function refresh() {
  if (state.loading) return;
  state.loading = true; render();
  try {
    const [liftsText, sessionsText, benchFetched] = await Promise.all([
      getCsv(TABS.lifts), getCsv(TABS.sessions), getCsv(TABS.bench).catch(() => null),
    ]);
    // If the benchmark tab can't be read, keep the last benchmark data rather than failing the whole refresh.
    const benchText = benchFetched ?? state.benchText ?? BENCH_CSV;
    state.benchText = benchText;
    state.data = build(liftsText, sessionsText, benchText);
    state.source = "live"; state.updatedAt = Date.now(); state.error = null;
    writeSaved({ savedAt: state.updatedAt, lifts: liftsText, sessions: sessionsText, bench: benchText });
  } catch (err) {
    const fallback = state.source === "live" ? "the last live reading" : state.source === "saved" ? "your last saved copy" : "the built-in copy";
    state.error = `${describe(err)}. Showing ${fallback}.`;
  } finally {
    state.loading = false; render();
  }
}

// ─── Rendering ───────────────────────────────────────────────────────────────
// ─── Benchmark library: the girl workouts, shown on the Stats tab ───────────
// Taken from the library's descriptions. Items marked check need confirming on crossfit.com before you rely on them.
const WORKOUTS = [
  { name: "Angie", format: "For time", movements: "100 pull-ups · 100 push-ups · 100 sit-ups · 100 air squats", rx: "No weights" },
  { name: "Barbara", format: "For time, 5 rounds", movements: "20 pull-ups · 30 push-ups · 40 sit-ups · 50 air squats per round", rx: "No weights", check: "rest between rounds needs checking" },
  { name: "Chelsea", format: "EMOM 30 min, score rounds", movements: "5 pull-ups · 10 push-ups · 15 air squats each minute", rx: "No weights", cap: "30 min" },
  { name: "Cindy", format: "AMRAP 20 min, score rounds and reps", movements: "5 pull-ups · 10 push-ups · 15 air squats", rx: "No weights", cap: "20 min" },
  { name: "Diane", format: "For time, 21-15-9", movements: "Deadlifts · handstand push-ups", rx: "102 kg" },
  { name: "Elizabeth", format: "For time, 21-15-9", movements: "Cleans · ring dips", rx: "61 kg" },
  { name: "Fran", format: "For time, 21-15-9", movements: "Thrusters · pull-ups", rx: "43 kg" },
  { name: "Grace", format: "For time", movements: "30 clean and jerks", rx: "61 kg" },
  { name: "Helen", format: "For time, 3 rounds", movements: "400 m run · 21 kettlebell swings · 12 pull-ups", rx: "24 kg kettlebells", check: "kettlebell weights need checking" },
  { name: "Isabel", format: "For time", movements: "30 snatches", rx: "61 kg" },
  { name: "Jackie", format: "For time", movements: "1000 m row · 50 thrusters · 30 pull-ups", rx: "20 kg barbell" },
  { name: "Karen", format: "For time", movements: "150 wall-ball shots", rx: "9 kg balls", check: "ball weights need checking" },
  { name: "Annie", format: "For time, 50-40-30-20-10", movements: "Double-unders · sit-ups", rx: "No weights", check: "unverified" },
  { name: "Mary", format: "AMRAP 20 min, score rounds and reps", movements: "5 handstand push-ups · 10 pistols · 15 pull-ups", rx: "No weights", cap: "20 min", check: "movements need checking" },
  { name: "Nancy", format: "For time, 5 rounds", movements: "400 m run · 15 overhead squats", rx: "43 kg", check: "weights need checking" },
  { name: "Amanda", format: "For time, 9-7-5", movements: "Muscle-ups · squat snatches", rx: "61 kg", check: "unverified" },
  { name: "Kelly", format: "For time, 5 rounds", movements: "400 m run · 30 box jumps · 30 wall-ball shots", rx: "" },
];

function render() {
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === state.tab)));
  const view = document.getElementById("view");
  view.classList.toggle("progress-view", state.tab === "progress");
  const views = { stats: renderStats, trends: renderTrends, progress: renderProgress, load: renderLoad };
  const d = state.data ? { ...state.data, now: new Date() } : null;
  view.innerHTML = (d ? views[state.tab](d) : '<section class="card"><p class="empty">Loading…</p></section>') + (state.error ? `<div class="notice wide">${esc(state.error)}</div>` : "");
  const src = document.getElementById("source");
  const btn = document.getElementById("refresh");
  btn.disabled = state.loading;
  if (state.loading) src.textContent = "Refreshing…";
  else if (state.source === "live") src.textContent = `Live · ${timeLabel(state.updatedAt)}`;
  else if (state.source === "saved") src.textContent = `Saved copy · ${timeLabel(state.updatedAt)}`;
  else src.textContent = `Built-in copy · ${SNAPSHOT_DATE}`;
}

// ─── Start-up ─────────────────────────────────────────────────────────────────
// (The workout search listener is registered above, next to the Workouts tab.)
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); }));
document.getElementById("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && (!state.updatedAt || Date.now() - state.updatedAt > REFRESH_MS)) refresh();
});
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);

// Show the last good copy straight away, then fetch the live sheet.
const saved = readSaved();
try {
  if (saved?.lifts) {
    state.benchText = saved.bench ?? null;
    state.data = build(saved.lifts, saved.sessions, saved.bench ?? BENCH_CSV);
    state.source = "saved"; state.updatedAt = saved.savedAt;
  } else throw new Error("no saved copy");
} catch {
  state.data = build(LIFT_CSV, SESSION_CSV, BENCH_CSV);
  state.source = "snapshot";
}
render();
refresh();
</script>
